<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8c97a"/>
      <stop offset="50%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07c30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Gold top-left accent line -->
  <rect x="5" y="5" width="8" height="1" rx="0.5" fill="url(#gold)" opacity="0.7"/>

  <!-- Letter V — bold, centered -->
  <text
    x="16"
    y="22"
    font-family="Inter, system-ui, sans-serif"
    font-size="17"
    font-weight="900"
    text-anchor="middle"
    fill="url(#gold)"
    letter-spacing="-1"
  >V.</text>
</svg>
