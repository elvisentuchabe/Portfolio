<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1B8"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9F7C53"/>
    </linearGradient>
    <linearGradient id="auraDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1C"/>
      <stop offset="100%" stop-color="#0E0E0D"/>
    </linearGradient>
  </defs>

  <!-- Luxury Squircle Background -->
  <rect width="64" height="64" rx="14" fill="url(#auraDarkGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#auraGoldGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Subtle Diamond Crest Frame -->
  <polygon points="32,8 56,32 32,56 8,32" fill="none" stroke="#C5A880" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 1.5"/>

  <!-- Architectural 'A' Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg -->
    <path d="M32 15 L19 49" stroke="url(#auraGoldGrad)" stroke-width="2.6"/>
    <!-- Right Leg -->
    <path d="M32 15 L45 49" stroke="url(#auraGoldGrad)" stroke-width="2.6"/>
    <!-- Crossbar -->
    <line x1="24" y1="38" x2="40" y2="38" stroke="url(#auraGoldGrad)" stroke-width="2"/>
    <!-- Serif Base Caps -->
    <line x1="16" y1="49" x2="22" y2="49" stroke="#E5D1B8" stroke-width="1.8"/>
    <line x1="42" y1="49" x2="48" y2="49" stroke="#E5D1B8" stroke-width="1.8"/>
    <!-- Apex Finial -->
    <circle cx="32" cy="15" r="1.5" fill="#E5D1B8"/>
    <!-- Harmonious Medical Core -->
    <circle cx="32" cy="30" r="2.2" fill="url(#auraGoldGrad)"/>
  </g>
</svg>
