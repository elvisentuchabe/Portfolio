<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon filled -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="url(#g)" filter="url(#glow)"/>
  <!-- Outer hex outline white -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <!-- Inner hexagon filled translucent -->
  <polygon points="16,8 23,12 23,20 16,24 9,20 9,12" fill="rgba(255,255,255,0.18)"/>
  <!-- Inner hex outline white bright -->
  <polygon points="16,8 23,12 23,20 16,24 9,20 9,12" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="white" opacity="0.9"/>
</svg>
