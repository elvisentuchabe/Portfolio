  <script type="text/babel" data-type="module">

    const { useState, useEffect, useRef, useCallback } = React;

    /* ─────────────────────────────────────────────
       HOOK: useIntersectionObserver
       Triggers .visible class for scroll reveals
    ───────────────────────────────────────────── */
    function useRevealOnScroll() {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
        );
        const targets = document.querySelectorAll(".reveal");
        targets.forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    /* ─────────────────────────────────────────────
       COMPONENT: Header
    ───────────────────────────────────────────── */
    function Header({ owner }) {
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const navItems = [
        { label: "Proyectos", href: "#projects" },
        { label: "Servicios", href: "#services" },
        { label: "Contacto",  href: "#contact" },
      ];

      const scrollTo = (e, href) => {
        e.preventDefault();
        const target = document.querySelector(href);
        if (target) target.scrollIntoView({ behavior: "smooth" });
        setMenuOpen(false);
      };

      return (
        <header
          className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${
            scrolled
              ? "bg-[#0a0a0a]/90 backdrop-blur-xl border-b border-[#1a1a1a]"
              : "bg-transparent"
          }`}
        >
          <nav className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            {/* Logo */}

              href="#"
              onClick={(e) => scrollTo(e, "#root")}
              className="flex items-center gap-3 group"
              style={{ cursor: "none" }}

                style={{ fontVariantLigatures: "none" }}

                V.

                {owner.firstName || "Vicente"} <span className="text-gold font-bold">{owner.lastName || "Romero"}</span>
              </span>
            </a>

            {/* Desktop nav */}
            <ul className="hidden md:flex items-center gap-8">
              {navItems.map((item) => (
                <li key={item.href}>
                  <a href={item.href} onClick={(e) => scrollTo(e, item.href)} className="nav-link">
                    {item.label}
                  </a>
                </li>
              ))}
            </ul>

            {/* Availability pill */}
            <a
              href="#contact"
              onClick={(e) => scrollTo(e, "#contact")}
              className="hidden md:flex items-center gap-2 px-4 py-2 rounded-full text-[11px] font-semibold tracking-wider uppercase text-[#888] border border-[#222] hover:border-[#333] hover:text-[#aaa] transition-all duration-300"
              style={{ cursor: "none" }}
            >
              <span className="availability-dot"></span>
              Disponible
            </a>

            {/* Mobile hamburger */}
            <button
              onClick={() => setMenuOpen(!menuOpen)}
              className="md:hidden flex flex-col gap-[5px] p-2"
              style={{ cursor: "none" }}
              aria-label="Abrir menú"
            >
              <span className={`block w-5 h-[1.5px] bg-[#888] transition-all duration-300 ${menuOpen ? "rotate-45 translate-y-[6.5px]" : ""}`} />
              <span className={`block w-5 h-[1.5px] bg-[#888] transition-all duration-300 ${menuOpen ? "opacity-0" : ""}`} />
              <span className={`block w-5 h-[1.5px] bg-[#888] transition-all duration-300 ${menuOpen ? "-rotate-45 -translate-y-[6.5px]" : ""}`} />
            </button>
          </nav>

          {/* Mobile menu */}
          <div
            className={`md:hidden overflow-hidden transition-all duration-400 ${
              menuOpen ? "max-h-60" : "max-h-0"
            } bg-[#0a0a0a]/95 backdrop-blur-xl border-b border-[#1a1a1a]`}
          >
            <ul className="px-6 py-4 flex flex-col gap-4">
              {navItems.map((item) => (

                    href={item.href}
                    onClick={(e) => scrollTo(e, item.href)}

                  <span className="availability-dot"></span>
                  Disponible para proyectos

          {/* Scroll hint */}

            "animate-fade-in animate-delay-1200"

      );
    }

            </div>

      );

    /* ─────────────────────────────────────────────
       COMPONENT: ServicesSection
    ───────────────────────────────────────────── */

        {
          icon: "✦",

          description: "Interfaces que equilibran estética y funcionalidad. Cada decisión visual tiene un porqué.",

    /* ─────────────────────────────────────────────
       COMPONENT: ContactSection
    ───────────────────────────────────────────── */
    function ContactSection({ owner }) {
      const form = useRef();
      const [status, setStatus] = useState("");

      const sendEmail = (e) => {
        e.preventDefault();
        setStatus("sending");

        // IMPORTANTE: Reemplaza estos valores por los tuyos de EmailJS
        const SERVICE_ID = 'service_6yvtdff';
        const TEMPLATE_ID = 'template_njj1nag';
        const PUBLIC_KEY = 'U6mX3b9cyn1LtSge8';

        emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, form.current, PUBLIC_KEY)
          .then((result) => {
              console.log(result.text);
              setStatus("success");
              e.target.reset();
              setTimeout(() => setStatus(""), 5000);
          }, (error) => {
              console.log(error.text);
              setStatus("error");
              setTimeout(() => setStatus(""), 5000);
          });
      };

      return (
        <section id="contact" className="py-24 md:py-40 px-6 relative overflow-hidden">
          {/* Background glow */}
          <div
            className="absolute bottom-0 left-1/2 -translate-x-1/2 pointer-events-none"
            style={{
              width: "800px", height: "400px",
              background: "radial-gradient(ellipse at center bottom, rgba(201,168,76,0.06) 0%, transparent 70%)",
              filter: "blur(40px)",
            }}
          />

          <div className="max-w-4xl mx-auto text-center relative z-10">
            {/* Eyebrow */}
            <div className="reveal flex items-center justify-center gap-3 mb-8">
              <span className="h-[1px] w-8 bg-gold opacity-70" />
              <span className="text-[11px] font-semibold tracking-[0.2em] uppercase text-[#555]">
                Contacto
              </span>
              <span className="h-[1px] w-8 bg-gold opacity-70" />
            </div>

            {/* Heading */}
            <h2 className="reveal reveal-delay-1 text-4xl md:text-6xl lg:text-7xl font-black text-white tracking-tight leading-none mb-8">
              ¿Tienes un<br />
              <span className="text-gold-gradient">proyecto?</span>
            </h2>

            <p className="reveal reveal-delay-2 text-base text-[#555] leading-relaxed max-w-lg mx-auto mb-12">
              Estoy disponible para proyectos freelance, colaboraciones y consultoría.
              Cuéntame tu idea y lo convertimos en realidad.
            </p>

            {/* Contact Form */}
            <div className="reveal reveal-delay-3 max-w-md mx-auto mb-12">
              <form ref={form} onSubmit={sendEmail} className="flex flex-col gap-4 text-left">
                <div>
                  <label className="block text-xs font-semibold tracking-wider text-[#888] uppercase mb-2">Nombre</label>
                  <input type="text" name="user_name" required className="w-full bg-[#111] border border-[#222] rounded-md px-4 py-3 text-white focus:outline-none focus:border-gold transition-colors duration-300" placeholder="Tu nombre" />
                </div>
                <div>
                  <label className="block text-xs font-semibold tracking-wider text-[#888] uppercase mb-2">Email</label>
                  <input type="email" name="user_email" required className="w-full bg-[#111] border border-[#222] rounded-md px-4 py-3 text-white focus:outline-none focus:border-gold transition-colors duration-300" placeholder="tu@email.com" />
                </div>
                <div>
                  <label className="block text-xs font-semibold tracking-wider text-[#888] uppercase mb-2">Mensaje</label>
                  <textarea name="message" required rows="4" className="w-full bg-[#111] border border-[#222] rounded-md px-4 py-3 text-white focus:outline-none focus:border-gold transition-colors duration-300 resize-none" placeholder="¿En qué te puedo ayudar?"></textarea>
                </div>
                <button type="submit" disabled={status === "sending"} className="btn-primary mt-2 w-full justify-center disabled:opacity-50" style={{ cursor: "none" }}>
                  {status === "sending" ? "Enviando..." : "Enviar mensaje"}
                </button>
                {status === "success" && <p className="text-sm text-green-500 text-center mt-2">¡Mensaje enviado con éxito!</p>}
                {status === "error" && <p className="text-sm text-red-500 text-center mt-2">Hubo un error al enviar. Inténtalo de nuevo.</p>}
              </form>
            </div>

            {/* Location */}
            <div className="reveal reveal-delay-4 mt-10 flex items-center justify-center gap-2 text-[12px] text-[#444] font-medium tracking-wider">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="5" r="2" stroke="currentColor" strokeWidth="1"/>
                <path d="M6 1a4 4 0 014 4c0 3-4 7-4 7S2 8 2 5a4 4 0 014-4z" stroke="currentColor" strokeWidth="1"/>
              </svg>
              {owner.location}
              <span className="text-[#2a2a2a] mx-2">·</span>
              <span className="flex items-center gap-1.5">
                <span className="availability-dot" style={{ width: "6px", height: "6px" }} />
                {owner.availableText}
              </span>
            </div>
          </div>
        </section>
      );
    }

    /* ─────────────────────────────────────────────
       COMPONENT: Footer
    ───────────────────────────────────────────── */
    function Footer({ owner }) {
      const year = new Date().getFullYear();

      const socialLinks = [
        { label: "Twitter",   href: owner.socials.twitter },
        { label: "LinkedIn",  href: owner.socials.linkedin },
        { label: "GitHub",    href: owner.socials.github },
        { label: "Dribbble",  href: owner.socials.dribbble },
      ];

      return (
        <footer className="footer-gradient px-6 py-10">
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            {/* Left */}
            <div className="flex items-center gap-3">
              <span className="text-base font-black text-gold-gradient">V.</span>
              <span className="text-[11px] text-[#333] font-medium tracking-wider uppercase">
                © {year} {owner.name}
              </span>
            </div>

            {/* Center — socials */}
            <ul className="flex items-center gap-6">
              {socialLinks.map((link) => (
                <li key={link.label}>
                  <a
                    href={link.href}
                    className="text-[11px] font-medium text-[#333] hover:text-[#888] transition-colors duration-300 tracking-wider uppercase"
                    style={{ cursor: "none" }}
                  >
                    {link.label}
                  </a>
                </li>
              ))}
            </ul>
          </div>
        </footer>
      );
    }

    /* ─────────────────────────────────────────────
       ROOT: App
    ───────────────────────────────────────────── */
    function App() {
      const [isFirstVisit, setIsFirstVisit] = useState(false);

      // localStorage first-visit check
      useEffect(() => {
        const key = "portfolio_visited";
        const visited = localStorage.getItem(key);
        if (!visited) {
          setIsFirstVisit(true);
          localStorage.setItem(key, "1");
        }
        // Apply no-intro class to body for returning visitors
        if (visited) {
          document.body.classList.add("no-intro");
        }
      }, []);

      // Scroll reveal
      useRevealOnScroll();

      const owner    = window.ownerData;
      const projects = window.projectsData;

      return (
        <>
          <Header owner={owner} />
          <main>
            <HeroSection owner={owner} isFirstVisit={isFirstVisit} />
            <ProjectsGrid projects={projects} />
            <ServicesSection />
            <ContactSection owner={owner} />
          </main>
          <Footer owner={owner} />
        </>
      );
    }

    /* ── Render ── */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));

  </script>

  <!-- ── Custom cursor script ── -->
  <script>
    (function () {
      const dot  = document.getElementById("cursorDot");
      const ring = document.getElementById("cursorRing");
      if (!dot || !ring) return;

      /* Only on non-touch devices */
      if (window.matchMedia("(hover: none)").matches) {
        dot.style.display = ring.style.display = "none";
        return;
      }

      let dotX = 0, dotY = 0, ringX = 0, ringY = 0;
      let mouseX = 0, mouseY = 0;
      let raf;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      document.addEventListener("mouseleave", () => {
        dot.classList.add("cursor-hidden");
        ring.classList.add("cursor-hidden");
      });
      document.addEventListener("mouseenter", () => {
        dot.classList.remove("cursor-hidden");
        ring.classList.remove("cursor-hidden");
      });

      /* Hover effect on interactive elements */
      const HOVER_SELECTORS = "a, button, [role='button'], label, input, select, textarea";
      document.addEventListener("mouseover", (e) => {
        if (e.target.closest(HOVER_SELECTORS)) ring.classList.add("hovering");
        else ring.classList.remove("hovering");
      });

      /* Smooth follow animation */
      function animate() {
        dotX  = mouseX;
        dotY  = mouseY;
        ringX += (mouseX - ringX) * 0.12;
        ringY += (mouseY - ringY) * 0.12;

        dot.style.left  = dotX  + "px";
        dot.style.top   = dotY  + "px";
        ring.style.left = ringX + "px";
        ring.style.top  = ringY + "px";

        raf = requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
